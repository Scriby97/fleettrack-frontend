<svg width="512" height="512" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- FleetTrack App-Icon (Android Home-Screen / PWA). Volle schwarze Flaeche
       bis zum Rand (kein transparenter Rand, den Android sonst mit einem
       weissen Kreis/Quadrat auffuellt) + Schneeflocke zentriert innerhalb der
       "Safe Zone" fuer adaptive Icons (Inhalt bleibt innerhalb ~55% Durchmesser,
       damit ein rundes/eckiges Masking durch den Launcher nichts abschneidet). -->
  <defs>
    <filter id="outline" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="dilated"/>
      <feGaussianBlur in="dilated" stdDeviation="2.2" result="blurred"/>
      <feComponentTransfer in="blurred" result="rounded">
        <feFuncA type="linear" slope="25" intercept="-8"/>
      </feComponentTransfer>
      <feFlood flood-color="#818cf8" result="blueFlood"/>
      <feComposite in="blueFlood" in2="rounded" operator="in" result="blueOutline"/>
      <feMerge>
        <feMergeNode in="blueOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0b0b0b"/>
  <g transform="translate(200,200) scale(0.62) translate(-200,-200)">
    <g filter="url(#outline)">
      <g stroke="#fafafa" stroke-linecap="round" fill="#fafafa">
        <line x1="200.0" y1="162.0" x2="200.0" y2="88.0" stroke-width="5.5"/>
        <line x1="232.91" y1="181.0" x2="296.99" y2="144.0" stroke-width="5.5"/>
        <line x1="232.91" y1="219.0" x2="296.99" y2="256.0" stroke-width="5.5"/>
        <line x1="200.0" y1="238.0" x2="200.0" y2="312.0" stroke-width="5.5"/>
        <line x1="167.09" y1="219.0" x2="103.01" y2="256.0" stroke-width="5.5"/>
        <line x1="167.09" y1="181.0" x2="103.01" y2="144.0" stroke-width="5.5"/>
        <line x1="200.0" y1="123.04" x2="179.65" y2="110.32" stroke-width="4.5"/>
        <line x1="200.0" y1="123.04" x2="220.35" y2="110.32" stroke-width="4.5"/>
        <line x1="200.0" y1="100.16" x2="179.65" y2="87.44" stroke-width="4.5"/>
        <line x1="200.0" y1="100.16" x2="220.35" y2="87.44" stroke-width="4.5"/>
        <line x1="266.65" y1="161.52" x2="267.49" y2="137.53" stroke-width="4.5"/>
        <line x1="266.65" y1="161.52" x2="287.84" y2="172.79" stroke-width="4.5"/>
        <line x1="286.46" y1="150.08" x2="287.3" y2="126.09" stroke-width="4.5"/>
        <line x1="286.46" y1="150.08" x2="307.65" y2="161.35" stroke-width="4.5"/>
        <line x1="266.65" y1="238.48" x2="287.84" y2="227.21" stroke-width="4.5"/>
        <line x1="266.65" y1="238.48" x2="267.49" y2="262.47" stroke-width="4.5"/>
        <line x1="286.46" y1="249.92" x2="307.65" y2="238.65" stroke-width="4.5"/>
        <line x1="286.46" y1="249.92" x2="287.3" y2="273.91" stroke-width="4.5"/>
        <line x1="200.0" y1="276.96" x2="220.35" y2="289.68" stroke-width="4.5"/>
        <line x1="200.0" y1="276.96" x2="179.65" y2="289.68" stroke-width="4.5"/>
        <line x1="200.0" y1="299.84" x2="220.35" y2="312.56" stroke-width="4.5"/>
        <line x1="200.0" y1="299.84" x2="179.65" y2="312.56" stroke-width="4.5"/>
        <line x1="133.35" y1="238.48" x2="132.51" y2="262.47" stroke-width="4.5"/>
        <line x1="133.35" y1="238.48" x2="112.16" y2="227.21" stroke-width="4.5"/>
        <line x1="113.54" y1="249.92" x2="112.7" y2="273.91" stroke-width="4.5"/>
        <line x1="113.54" y1="249.92" x2="92.35" y2="238.65" stroke-width="4.5"/>
        <line x1="133.35" y1="161.52" x2="112.16" y2="172.79" stroke-width="4.5"/>
        <line x1="133.35" y1="161.52" x2="132.51" y2="137.53" stroke-width="4.5"/>
        <line x1="113.54" y1="150.08" x2="92.35" y2="161.35" stroke-width="4.5"/>
        <line x1="113.54" y1="150.08" x2="112.7" y2="126.09" stroke-width="4.5"/>
      </g>
      <polygon points="200.0,160.0 234.64,180.0 234.64,220.0 200.0,240.0 165.36,220.0 165.36,180.0" fill="#ffffff"/>
