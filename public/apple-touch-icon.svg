<svg width="180" height="180" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- FleetTrack App-Icon (Android Home-Screen / PWA / Apple Touch Icon).
       Volle Navy-Flaeche bis zum Rand (kein transparenter Rand, den
       Android/iOS sonst selbst auffuellen wuerden) + FT-Monogramm zentriert
       innerhalb der "Safe Zone" fuer adaptive Icons (~62% Durchmesser, damit
       rundes/eckiges Masking durch den Launcher nichts abschneidet). -->
  <rect width="400" height="400" fill="#0a1222"/>
  <g transform="translate(200,200) scale(0.62) translate(-200,-200)">
    <g fill="#6fb7ff">
      <rect x="60" y="80" width="42" height="240"/>
      <rect x="60" y="80" width="130" height="42"/>
      <rect x="60" y="172" width="106" height="42"/>
    </g>
    <g fill="#e0590c">
      <rect x="210" y="80" width="130" height="42"/>
      <rect x="254" y="80" width="42" height="240"/>
    </g>
  </g>
</svg>
