<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- FleetTrack Logo - FT-Monogramm fuer hellen Hintergrund. Blockige,
       geometrische Buchstabenformen (keine Live-Schrift, damit das SVG auch
       eingebettet als <img> ueberall zuverlaessig gleich aussieht). F in
       Eisblau (dunkel), T in Signalorange - dieselbe Farbe wie die primaere
       Aktion in der App. -->
  <g fill="#2f6fd1">
    <rect x="60" y="80" width="42" height="240"/>
    <rect x="60" y="80" width="130" height="42"/>
    <rect x="60" y="172" width="106" height="42"/>
  </g>
  <g fill="#e0590c">
    <rect x="210" y="80" width="130" height="42"/>
    <rect x="254" y="80" width="42" height="240"/>
  </g>
</svg>
